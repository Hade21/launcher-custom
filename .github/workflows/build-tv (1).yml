name: Build APK TV
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Tulis source project
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_SRC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LauncherTV"
          include(":app")
          EOF_SRC
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_SRC
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_SRC'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          kotlin.code.style=official
          EOF_SRC
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "id.launcher.tv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "id.launcher.tv"
                  minSdk = 21
                  targetSdk = 29
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("debug")
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF_SRC
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="Launcher TV"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:stateNotNeeded="true"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC
          mkdir -p $(dirname app/src/main/java/id/launcher/tv/MainActivity.kt)
          cat > app/src/main/java/id/launcher/tv/MainActivity.kt <<'EOF_SRC'
          package id.launcher.tv

          import android.app.Activity
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView
          import android.widget.Toast

          private class AppItem(val label: String, val icon: Drawable, val intent: Intent, val pkg: String?)

          class MainActivity : Activity() {

              private val apps = ArrayList<AppItem>()
              private val ui = Handler(Looper.getMainLooper())
              private lateinit var adapter: AppAdapter
              private lateinit var grid: GridView
              private var loading = false

              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) = loadApps()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#1B2A4A"), Color.parseColor("#0A0D14"))
                      )
                      // Area aman TV (overscan)
                      setPadding(dp(48), dp(32), dp(48), dp(24))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.BOTTOM
                  }
                  header.addView(TextClock(this).apply {
                      format24Hour = "HH:mm"; format12Hour = "HH:mm"
                      textSize = 56f; setTextColor(Color.WHITE)
                  })
                  header.addView(TextClock(this).apply {
                      format24Hour = "EEEE, d MMMM"; format12Hour = "EEEE, d MMMM"
                      textSize = 20f; setTextColor(Color.parseColor("#9FB0C8"))
                      setPadding(dp(20), 0, 0, dp(10))
                  })
                  root.addView(header)

                  adapter = AppAdapter()
                  grid = GridView(this).apply {
                      numColumns = GridView.AUTO_FIT
                      columnWidth = dp(130)
                      stretchMode = GridView.STRETCH_COLUMN_WIDTH
                      horizontalSpacing = dp(12)
                      verticalSpacing = dp(12)
                      clipToPadding = false
                      setPadding(dp(4), dp(12), dp(4), dp(12))
                      selector = GradientDrawable().apply {
                          setColor(Color.parseColor("#40FFFFFF"))
                          setStroke(dp(3), Color.WHITE)
                          cornerRadius = dp(14).toFloat()
                      }
                      setDrawSelectorOnTop(false)
                      isFocusable = true
                      setAdapter(adapter)
                      setOnItemClickListener { _, _, pos, _ -> start(apps[pos].intent) }
                      // Tahan OK: info app (untuk uninstall / nonaktifkan)
                      setOnItemLongClickListener { _, _, pos, _ ->
                          val pkg = apps[pos].pkg
                          if (pkg != null) {
                              start(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")))
                          }
                          true
                      }
                  }
                  root.addView(grid, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

                  root.addView(TextView(this).apply {
                      text = "Tahan tombol OK pada aplikasi untuk info / nonaktifkan / uninstall"
                      textSize = 14f
                      setTextColor(Color.parseColor("#6F7F99"))
                  })

                  setContentView(root)
                  grid.requestFocus()
                  loadApps()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  grid.setSelection(0)   // tombol Home: kembali ke awal
              }

              override fun onStart() {
                  super.onStart()
                  registerReceiver(pkgReceiver, IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED)
                      addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addDataScheme("package")
                  })
              }

              override fun onStop() {
                  super.onStop()
                  try { unregisterReceiver(pkgReceiver) } catch (_: Exception) {}
              }

              override fun onBackPressed() {}

              private fun start(i: Intent) {
                  try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Aplikasi tidak bisa dibuka", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun loadApps() {
                  if (loading) return
                  loading = true
                  Thread {
                      val pm = packageManager
                      val tvPkgs = HashSet<String>()
                      val tv = ArrayList<AppItem>()
                      val other = ArrayList<AppItem>()

                      fun collect(cat: String, into: MutableList<AppItem>, skip: Set<String>?) {
                          val q = Intent(Intent.ACTION_MAIN).addCategory(cat)
                          for (ri in pm.queryIntentActivities(q, 0)) {
                              val ai = ri.activityInfo
                              if (ai.packageName == packageName) continue
                              if (skip != null && ai.packageName in skip) continue
                              val cn = ComponentName(ai.packageName, ai.name)
                              into.add(
                                  AppItem(
                                      ri.loadLabel(pm).toString(), ri.loadIcon(pm),
                                      Intent(Intent.ACTION_MAIN).addCategory(cat).setComponent(cn),
                                      ai.packageName
                                  )
                              )
                          }
                      }
                      collect(Intent.CATEGORY_LEANBACK_LAUNCHER, tv, null)
                      tv.forEach { tvPkgs.add(it.pkg!!) }
                      collect(Intent.CATEGORY_LAUNCHER, other, tvPkgs)

                      val list = ArrayList<AppItem>()
                      // Setelan selalu di posisi pertama
                      val sIntent = Intent(Settings.ACTION_SETTINGS)
                      val sIcon = pm.resolveActivity(sIntent, 0)?.loadIcon(pm) ?: pm.defaultActivityIcon
                      list.add(AppItem("Setelan", sIcon, sIntent, null))
                      list.addAll(tv.sortedBy { it.label.lowercase() })
                      list.addAll(other.sortedBy { it.label.lowercase() })

                      ui.post {
                          apps.clear(); apps.addAll(list)
                          adapter.notifyDataSetChanged()
                          loading = false
                      }
                  }.start()
              }

              private inner class AppAdapter : BaseAdapter() {
                  override fun getCount() = apps.size
                  override fun getItem(p: Int) = apps[p]
                  override fun getItemId(p: Int) = p.toLong()
                  override fun getView(p: Int, cv: View?, parent: ViewGroup): View {
                      val v = cv ?: LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(dp(6), dp(14), dp(6), dp(10))
                          addView(ImageView(context).apply {
                              id = 1; scaleType = ImageView.ScaleType.FIT_CENTER
                          }, LinearLayout.LayoutParams(dp(72), dp(72)))
                          addView(TextView(context).apply {
                              id = 2; textSize = 16f; setTextColor(Color.WHITE)
                              gravity = Gravity.CENTER; maxLines = 1
                              ellipsize = TextUtils.TruncateAt.END
                              setPadding(0, dp(8), 0, 0)
                          })
                      }
                      val a = apps[p]
                      v.findViewById<ImageView>(1).setImageDrawable(a.icon)
                      v.findViewById<TextView>(2).text = a.label
                      return v
                  }
              }
          }
          EOF_SRC
      - name: Build
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherTV-apk
          path: app/build/outputs/apk/release/*.apk
